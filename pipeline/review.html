<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>felt-BPM review</title>
<style>
  :root{
    --acc:#3ddc84; --accRGB:61,220,132; --bg:#0a0d0b; --bg2:#0f1411;
    --card:#141620; --line:rgba(255,255,255,.1); --t1:#e9ebf0; --t2:#aeb2bb; --dim:#6a6e78;
    --num:ui-monospace,Menlo,'DejaVu Sans Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));color:var(--t1);
    font:14px/1.5 -apple-system,system-ui,sans-serif;min-height:100vh;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}
  header{width:100%;max-width:720px;display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-size:14px;font-weight:600;letter-spacing:.3px;color:var(--t2)}
  header label{font-size:12px;color:var(--dim)}
  .prog{margin-left:auto;font:600 13px var(--num);color:var(--dim)}
  .bar{height:3px;background:rgba(255,255,255,.07);width:100%;max-width:720px}
  .bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
  main{width:100%;max-width:720px;padding:22px 20px 40px;flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;gap:18px;align-items:flex-start}
  .cover{width:120px;height:120px;border-radius:10px;object-fit:cover;background:#1a1d17;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .meta{flex:1;min-width:0}
  .title{font-size:20px;font-weight:700;color:#fff}
  .artist{font-size:15px;color:var(--t2);margin-top:2px}
  .sub{font-size:12px;color:var(--dim);margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
  .badge{display:inline-block;font:600 10px var(--num);padding:2px 7px;border-radius:999px;margin-left:8px;text-transform:uppercase;letter-spacing:.5px}
  .badge.high{background:rgba(255,170,60,.16);color:#ffb84d}
  .badge.low{background:rgba(90,170,255,.16);color:#6cb2ff}
  .big{display:flex;align-items:baseline;gap:14px;margin:18px 0 4px}
  .big .val{font:800 56px/1 var(--num);color:var(--acc);letter-spacing:-1px}
  .big .lab{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .big .cur{font:600 12px var(--num);color:var(--dim)}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
  .row .rl{width:100%;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
  button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:#171922;color:var(--t1);padding:9px 13px;transition:.12s}
  button:hover{border-color:rgba(var(--accRGB),.55);color:#fff}
  button.k{font:600 13px var(--num)}
  .kbd{font:600 10px var(--num);color:var(--dim);margin-left:6px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:84px}
  .chip .src{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .chip .n{font:700 17px var(--num)}
  .chip[disabled]{opacity:.35;cursor:default}
  .chip[disabled]:hover{border-color:var(--line);color:var(--t1)}
  .save{background:var(--acc);color:#08160d;border-color:var(--acc);font-weight:700;flex:1}
  .save:hover{filter:brightness(1.08);color:#08160d}
  .ghost{background:transparent}
  #num{width:92px;text-align:center;font:700 17px var(--num);background:#0e1017;color:#fff}
  audio{width:100%;margin-top:16px;height:38px;filter:invert(.9) hue-rotate(180deg)}
  .tap{position:relative}
  .tap .est{position:absolute;top:-19px;left:0;font:600 12px var(--num);color:var(--acc)}
  .foot{display:flex;gap:8px;margin-top:18px}
  .hint{max-width:720px;padding:14px 20px;color:var(--dim);font-size:12px;line-height:1.8}
  .hint b{color:var(--t2);font:600 11px var(--num)}
  .done{text-align:center;padding:60px 20px;color:var(--t2);line-height:1.8}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:#08160d;font-weight:700;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>felt-BPM review</h1>
  <label><input type="checkbox" id="allToggle" /> show all</label>
  <span class="prog" id="prog">–</span>
</header>
<div class="bar"><i id="progBar"></i></div>
<main id="main"></main>
<div class="hint">
  <b>space</b> play/pause · <b>T</b> tap tempo · <b>1/2/3</b> use Deezer/GSB/AB · <b>H</b> halve ·
  <b>D</b> double · <b>S</b> save+next · <b>←/→</b> prev/next. Saves write to
  <b>bpm_overrides.json</b> — rebuild to apply.
</div>
<div class="toast" id="toast"></div>

<script>
const $=(s,el=document)=>el.querySelector(s);
let songs=[], queue=[], i=0, pending=0, taps=[];
const decided=new Map();               // key -> saved felt bpm
const key=s=>(s.artist+'|'+s.title).toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('/review.json').then(r=>r.json()).then(d=>{ songs=d.songs||[]; applyFilter(); })
  .catch(()=>{ $('#main').innerHTML='<div class="done">Could not load review.json.<br>Run <b>node pipeline/build.mjs</b> first.</div>'; });

$('#allToggle').addEventListener('change',applyFilter);
function applyFilter(){ queue=songs.filter(s=>$('#allToggle').checked?true:s.queue); i=0; render(); }

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1100); }
function setPending(v){ pending=Math.max(1,Math.round(v)); const a=$('#val'),b=$('#num'); if(a)a.textContent=pending; if(b)b.value=pending; }

function render(){
  const n=queue.length;
  $('#prog').textContent = n ? `${Math.min(i+1,n)} / ${n} · ${decided.size} saved` : '0';
  $('#progBar').style.width = n ? `${Math.min(i,n)/n*100}%` : '0';
  if(!n){ $('#main').innerHTML='<div class="done">Nothing queued 🎉<br><small>Tick “show all” to review the whole catalogue.</small></div>'; return; }
  if(i>=n){ $('#main').innerHTML=`<div class="done">Queue reviewed — ${decided.size} saved.<br><small>Now run <b>node pipeline/build.mjs</b> to bake decisions into songs.json.</small></div>`; return; }
  const s=queue[i], rd=s.readings||{};
  pending=decided.get(key(s)) ?? s.felt_bpm; taps=[];
  const chip=(src,v,keyn)=>`<button class="chip" data-set="${v}" ${v>0?'':'disabled'}><span class="src">${src} <span class="kbd">${keyn}</span></span><span class="n">${v||'–'}</span></button>`;
  const mark=decided.has(key(s))?` · <span style="color:var(--acc)">saved ${decided.get(key(s))}</span>`:'';
  $('#main').innerHTML=`
    <div class="card">
      ${s.cover?`<img class="cover" src="${esc(s.cover)}" onerror="this.style.visibility='hidden'"/>`:'<div class="cover"></div>'}
      <div class="meta">
        <div class="title">${esc(s.title)}</div>
        <div class="artist">${esc(s.artist)}</div>
        <div class="sub">${esc(s.genre||'')} ${s.queue?`<span class="badge ${s.queue}">${s.queue==='high'?'maybe double-time':'maybe half-time'}</span>`:''}</div>
        <div class="big"><span class="val" id="val">${pending}</span><span class="lab">felt bpm</span>
          <span class="cur">technical ${s.bpm}${mark}</span></div>
        <div class="row"><span class="rl">source readings — click or press 1/2/3</span>
          ${chip('Deezer',rd.deezer,'1')} ${chip('GSB',rd.gsb,'2')} ${chip('AcousticBrainz',rd.ab,'3')}</div>
        <div class="row">
          <button class="k" data-half>½× <span class="kbd">H</span></button>
          <button class="k" data-double>×2 <span class="kbd">D</span></button>
          <div class="tap"><span class="est" id="est"></span><button class="k" id="tapBtn">TAP <span class="kbd">T</span></button></div>
          <input id="num" type="number" min="1" max="400" value="${pending}" />
        </div>
      </div>
    </div>
    <audio id="au" controls src="${esc(s.preview||'')}"></audio>
    <div class="foot">
      <button class="ghost" data-prev>← prev</button>
      <button class="save" data-save>Save + next <span class="kbd">S</span></button>
      <button class="ghost" data-skip>skip →</button>
    </div>`;
  const au=$('#au'); if(au && s.preview) au.play().catch(()=>{});
  $('#main').querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>setPending(+b.dataset.set)));
  $('[data-half]').addEventListener('click',()=>setPending(pending/2));
  $('[data-double]').addEventListener('click',()=>setPending(pending*2));
  $('#tapBtn').addEventListener('click',tap);
  $('#num').addEventListener('input',e=>{ const v=+e.target.value; if(v>0){pending=Math.round(v); $('#val').textContent=pending;} });
  $('[data-save]').addEventListener('click',save);
  $('[data-skip]').addEventListener('click',()=>{ i++; render(); });
  $('[data-prev]').addEventListener('click',()=>{ if(i>0){i--; render();} });
}

function tap(){
  const now=performance.now();
  taps.push(now); taps=taps.filter(t=>now-t<2500);
  if(taps.length>=2){
    let sum=0; for(let k=1;k<taps.length;k++) sum+=taps[k]-taps[k-1];
    const bpm=Math.round(60000/(sum/(taps.length-1)));
    $('#est').textContent=`~${bpm}`; setPending(bpm);
  } else $('#est').textContent='tap…';
}

function save(){
  const s=queue[i]; if(!s) return;
  fetch('/decide',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({artist:s.artist,title:s.title,bpm:pending})})
    .then(r=>r.json()).then(res=>{
      if(res.ok){ decided.set(key(s),pending); toast(`saved ${pending}`); i++; render(); }
      else toast('error: '+(res.error||'?'));
    }).catch(()=>toast('save failed'));
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT' && e.target.type==='number'){ if(e.key==='Enter'){ e.target.blur(); save(); } return; }
  const k=e.key.toLowerCase();
  if(e.code==='Space'){ e.preventDefault(); const au=$('#au'); if(au){ au.paused?au.play().catch(()=>{}):au.pause(); } }
  else if(k==='t'){ e.preventDefault(); tap(); }
  else if(k==='h'){ setPending(pending/2); }
  else if(k==='d'){ setPending(pending*2); }
  else if(k==='s'||k==='enter'){ e.preventDefault(); save(); }
  else if(k==='arrowright'){ i=Math.min(queue.length,i+1); render(); }
  else if(k==='arrowleft'){ if(i>0){ i--; render(); } }
  else if(k==='1'||k==='2'||k==='3'){ const src={1:'deezer',2:'gsb',3:'ab'}[k]; const b=queue[i]?.readings?.[src]; if(b>0) setPending(b); }
});
</script>
</body>
</html>
