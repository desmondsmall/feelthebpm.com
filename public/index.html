<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tempo — feel the BPM through songs you know</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* ---- Signal Green palette (from the design reference) ---- */
  :root {
    --acc: #3ddc84; --accRGB: 61,220,132; --name: #8fe6b4; --onacc: #08160d;
    --bg1: #0f1411; --bg2: #0a0d0b; --page: #080a08;
    --card: #141620; --chip: #0e1017; --btn: #171922;
    --t-hi: #f4f5f7; --t1: #e9ebf0; --t2: #c9cdd4; --t3: #aeb2bb;
    --dim: #7e838d; --dim2: #6a6e78; --faint: #61656f;
    --num: 'Space Grotesk', system-ui, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg2);
    color: var(--t1);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  a { color: var(--acc); text-decoration: none; }
  a:hover { color: var(--name); }

  /* ---- Stage: full-bleed, fills the whole viewport, fluid at any size ---- */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh; height: 100dvh;
    background: radial-gradient(120% 100% at 50% 0%, var(--bg1) 0%, var(--bg2) 70%);
    overflow: hidden;
    display: flex; flex-direction: column;
    --centerX: 50%; --axisY: 250px; --slotW: 200px;
    --cardW: 150px; --centerCardW: 190px; --disc: 150px;
    --beat: .5s;
  }

  /* ---- Toolbar: centered −/+ stepper with an editable BPM field ---- */
  /* nudge buttons flanking the pulse (− slower / + faster) — the stepper, folded into the center */
  .nbtn {
    position: absolute; top: 0; transform: translate(-50%,-50%);
    width: 50px; height: 50px; border-radius: 50%; background: var(--btn);
    border: 1px solid rgba(255,255,255,.1); color: var(--t2);
    font-size: 26px; line-height: 1; cursor: pointer; pointer-events: auto;
    display: flex; align-items: center; justify-content: center; user-select: none;
    transition: background .12s, border-color .12s, color .12s;
  }
  .nbtn:hover { background: #1e2029; border-color: rgba(var(--accRGB),.55); color: var(--t-hi); }
  .nbtn:active { transform: translate(-50%,-50%) scale(.92); }
  .nbtn.minus { left: calc(var(--disc) / -2 - 44px); }
  .nbtn.plus  { left: calc(var(--disc) / 2 + 44px); }

  /* ---- Genre bar ---- */
  .genres {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 20px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,.05);
    max-height: 92px; overflow-y: auto; scrollbar-width: none;
  }
  .genres::-webkit-scrollbar { display: none; }
  .g-chip {
    font-size: 12.5px; padding: 6px 15px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.13); color: var(--t3); background: transparent;
    white-space: nowrap; transition: .12s; font-weight: 500;
  }
  .g-chip:hover { border-color: rgba(255,255,255,.28); color: var(--t1); }
  .g-chip.on { background: var(--acc); color: var(--onacc); border-color: var(--acc); font-weight: 700; }

  /* ---- Field: the tempo axis + columns + pulse ---- */
  .field { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; cursor: grab; touch-action: none; }
  .field.dragging { cursor: grabbing; }
  .field.dragging .column, .field.dragging #centerCol, .field.dragging .pulse { transition: none !important; }

  .axis {
    position: absolute; top: var(--axisY); left: 64px; right: 64px; height: 2px;
    background: rgba(255,255,255,.13); transform: translateY(-50%); pointer-events: none;
  }
  .axis-end {
    position: absolute; top: calc(var(--axisY) - 46px); font: 500 14px -apple-system, system-ui, sans-serif;
    color: var(--dim2); letter-spacing: .3px; pointer-events: none; user-select: none;
  }
  .axis-end.slower { left: 30px; } .axis-end.faster { right: 30px; }

  /* colour pulse — a soft bloom that blooms out from the beat UNDER the cards (z-index below columns) */
  .glow { position: absolute; top: var(--axisY); left: var(--centerX); width: 0; height: 0; z-index: 1; pointer-events: none; }
  .glow span {
    position: absolute; left: 0; top: 0; width: var(--disc); height: var(--disc); border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--accRGB),.55) 0%, rgba(var(--accRGB),.24) 40%, rgba(var(--accRGB),0) 70%);
    transform: translate(-50%,-50%) scale(.85);
    animation: colorpulse var(--beat) ease-out infinite;
  }
  @keyframes colorpulse {
    0%   { transform: translate(-50%,-50%) scale(.85); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(3.4); opacity: 0; }
  }

  /* disc — dark, sits above the cards; its ring lights up bright exactly on the beat, then settles */
  .pulse { position: absolute; top: var(--axisY); left: var(--centerX); width: 0; height: 0; z-index: 5;
    transition: left .5s var(--ease); pointer-events: none; }
  .pulse .disc {
    position: absolute; left: 0; top: 0; width: var(--disc); height: var(--disc);
    transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #181b22, #101219);
    border: 2px solid rgba(var(--accRGB),.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: discbeat var(--beat) ease-out infinite;
  }
  @keyframes discbeat {
    0%   { border-color: rgba(var(--accRGB),1);  box-shadow: 0 0 52px rgba(var(--accRGB),.55), inset 0 0 30px rgba(0,0,0,.45); }
    32%  { border-color: rgba(var(--accRGB),.4); box-shadow: 0 0 18px rgba(var(--accRGB),.10), inset 0 0 34px rgba(0,0,0,.4); }
    100% { border-color: rgba(var(--accRGB),.4); box-shadow: 0 0 18px rgba(var(--accRGB),.10), inset 0 0 34px rgba(0,0,0,.4); }
  }
  .pulse .disc .big {
    font-family: var(--num); font-weight: 700; line-height: .9; color: var(--t-hi);
    letter-spacing: -1px; font-variant-numeric: tabular-nums;
    font-size: calc(var(--disc) * .35);
    pointer-events: auto; cursor: text; outline: none; border-radius: 6px;
    padding: 0 2px; caret-color: var(--acc);
  }
  .pulse .disc .big:hover { color: #fff; }
  .pulse .disc .big:focus { box-shadow: 0 0 0 2px rgba(var(--accRGB),.5); }
  .pulse .disc .mark {
    font-size: calc(var(--disc) * .068); font-weight: 600; letter-spacing: 2.5px;
    color: var(--name); margin-top: 6px; text-transform: uppercase;
  }

  /* side columns */
  .column {
    position: absolute; top: var(--axisY); left: var(--centerX); width: var(--cardW);
    margin-left: calc(var(--cardW) / -2); z-index: 2;
    transition: transform .5s var(--ease), opacity .4s var(--ease);
    will-change: transform, opacity;
  }
  .column .chip {
    position: absolute; left: 50%; top: 0; transform: translate(-50%,-50%);
    padding: 7px 14px; border-radius: 12px; background: var(--chip);
    border: 1px solid rgba(255,255,255,.12); font-family: var(--num);
    font-size: 19px; font-weight: 600; color: var(--t2); white-space: nowrap;
    cursor: pointer; transition: border-color .12s, color .12s;
  }
  .column .chip:hover { border-color: rgba(var(--accRGB),.5); color: var(--t-hi); }
  .column .chip .d { font-size: 13px; color: #8b909b; }
  .column .cards { display: flex; flex-direction: column; gap: 12px; padding-top: 34px; }

  .card {
    height: 66px; background: var(--card); border: 1px solid rgba(255,255,255,.07);
    border-radius: 13px; padding: 10px 15px; cursor: pointer; overflow: hidden;
    transition: border-color .12s, background .12s, transform .12s;
  }
  .card:hover { border-color: rgba(var(--accRGB),.45); background: #171a25; }
  .card:active { transform: scale(.98); }
  .card .t { font-size: 15px; font-weight: 600; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .a { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }

  .more {
    height: 48px; display: flex; align-items: center; justify-content: center;
    border: 1px dashed rgba(255,255,255,.16); border-radius: 13px;
    font-size: 14px; font-weight: 600; color: var(--dim);
  }

  /* center exact-match column — pours out of the beat */
  #centerCol {
    position: absolute; top: var(--axisY); left: var(--centerX); width: var(--centerCardW);
    margin-left: calc(var(--centerCardW) / -2); z-index: 4;
    transition: left .5s var(--ease); pointer-events: none;
  }
  #centerCol .cards { display: flex; flex-direction: column; gap: 12px;
    padding-top: calc(var(--disc) / 2 + 34px); }
  #centerCol .clabel {
    font-size: 13px; font-weight: 600; letter-spacing: .5px; color: var(--dim);
    text-transform: uppercase; text-align: center; margin-bottom: 4px;
  }
  #centerCol .empty { text-align: center; color: var(--dim2); font-size: 14px; line-height: 1.6; }
  .xcard {
    height: 66px; border-radius: 14px; display: flex; align-items: center; gap: 13px;
    padding: 0 15px; cursor: pointer; pointer-events: auto; overflow: hidden;
    transition: transform .12s, filter .12s;
  }
  .xcard:hover { filter: brightness(1.12); }
  .xcard:active { transform: scale(.98); }
  .xcard .badge {
    font-family: var(--num); font-size: 18px; font-weight: 700; color: var(--acc);
    line-height: 1; text-align: center; flex: 0 0 auto;
  }
  .xcard .badge small { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: 1px; opacity: .85; }
  .xcard .meta { flex: 1; min-width: 0; }
  .xcard .t { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xcard .a { font-size: 12.5px; color: rgba(255,255,255,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .xmore {
    height: 52px; display: flex; align-items: center; justify-content: center;
    border: 1px dashed rgba(var(--accRGB),.4); border-radius: 14px;
    font-size: 14px; font-weight: 600; color: var(--acc); pointer-events: auto; cursor: pointer;
  }

  /* footer hint + attribution */
  .hint {
    flex: 0 0 auto; text-align: center; font-size: 13px; color: var(--faint);
    padding: 14px 16px 16px; pointer-events: none;
  }
  .attr {
    position: absolute; right: 16px; bottom: 12px; font-size: 12px; color: var(--dim2); z-index: 6;
  }
  .attr a { color: var(--dim); }

  @media (max-width: 720px) {
    .axis { left: 24px; right: 24px; }
    .axis-end.slower { left: 30px; } .axis-end.faster { right: 30px; }
    /* single scrollable row keeps the top compact and the field tall */
    .genres { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; overflow-y: hidden; max-height: none; }
    .g-chip { flex: 0 0 auto; }
    /* the long hint collides with the (required) attribution on narrow screens */
    .hint { display: none; }
    .attr { left: 0; right: 0; text-align: center; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="genres" id="genres"></div>

  <div class="field" id="field">
    <div class="axis"></div>
    <div class="axis-end slower">◂ slower</div>
    <div class="axis-end faster">faster ▸</div>

    <div class="glow" id="glow"><span></span></div>

    <div class="pulse" id="pulse">
      <button class="nbtn minus" id="minus" aria-label="slower">−</button>
      <button class="nbtn plus" id="plus" aria-label="faster">+</button>
      <div class="disc">
        <div class="big" id="bigBpm" contenteditable="true" inputmode="numeric" spellcheck="false" aria-label="beats per minute">120</div>
        <div class="mark" id="mark">Allegro</div>
      </div>
    </div>

    <div id="sideLayer"></div>
    <div id="centerCol"></div>
  </div>

  <div class="hint">drag the line or type a BPM to shift the center · exact matches pour from the beat</div>
  <div class="attr">
    BPM &amp; art <a href="https://www.deezer.com" target="_blank" rel="noopener">Deezer</a> ·
    <a href="https://getsongbpm.com" target="_blank" rel="noopener">GetSongBPM</a>
  </div>
</div>

<!-- generated dataset: window.SONGS = [...] -->
<script src="songs.js"></script>
<script>
(function () {
  // ---------- data load (songs.js, with fetch fallback) ----------
  let SONGS = window.SONGS || [];
  const boot = SONGS.length ? Promise.resolve(SONGS)
    : fetch('songs.json').then(r => r.json()).then(d => (SONGS = d)).catch(() => (SONGS = []));

  // ---------- tempo markings ----------
  const MARKINGS = [
    [0,'Grave'],[40,'Largo'],[60,'Larghetto'],[66,'Adagio'],[76,'Andante'],
    [108,'Moderato'],[120,'Allegro'],[156,'Vivace'],[168,'Presto'],[200,'Prestissimo']
  ];
  const markingFor = b => { let m = '—'; for (const [t,n] of MARKINGS) if (b >= t) m = n; return m; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- config ----------
  const SHOW_GENRES = false;            // genre filter is hidden for now — flip to re-enable

  const $ = id => document.getElementById(id);
  const stage = $('stage'), field = $('field'), sideLayer = $('sideLayer'), centerCol = $('centerCol');
  const bigBpm = $('bigBpm'), mark = $('mark'), pulse = $('pulse');
  let editingBpm = false;               // true while the center number is being typed into

  // ---------- state ----------
  let bpm = 120;                        // continuous while dragging; round() for display
  const activeGenres = new Set();       // empty = all (multi-select)
  let byTempo = new Map();               // bpm -> [songs] (popularity desc), for active genres
  let tempos = [];                       // sorted distinct bpms present in the filter
  const sideCols = new Map();            // tempo -> column element (keyed reconcile)
  let geo = {};
  let lastCenterKey = null;

  // ---------- geometry (recomputed on resize) ----------
  function computeGeo () {
    const w = field.clientWidth, h = field.clientHeight;
    const row = 78;                       // card height 66 + gap 12
    const slotW = Math.max(196, Math.min(272, w * 0.205));
    const disc  = Math.max(138, Math.min(192, Math.min(w * 0.135, h * 0.34)));
    const cardW = Math.max(150, Math.min(214, slotW - 46));
    const centerCardW = Math.max(196, Math.min(256, slotW - 12));
    // move the whole assembly up and vertically centre it in the reclaimed space.
    // side cards start ~34px below the axis; center cards start below the disc + a label.
    const cap = (avail, top) => Math.floor((avail - top) / row);
    let axisY = h * 0.30;
    let sideCap   = Math.max(2, Math.min(6, cap(h - axisY, 100)));
    let centerCap = Math.max(2, Math.min(5, cap(h - axisY, disc / 2 + 150)));
    const blockBelow = Math.max(46 + sideCap * row, disc / 2 + 64 + centerCap * row + 52);
    const free = Math.max(0, h - disc / 2 - blockBelow);   // sit the block slightly above center
    axisY = Math.round(Math.max(disc / 2 + 24, Math.min(h - 130, free * 0.40 + disc / 2)));
    const below = h - axisY;
    sideCap   = Math.max(2, Math.min(6, cap(below, 100)));
    centerCap = Math.max(2, Math.min(5, cap(below, disc / 2 + 150)));
    geo = {
      w, h, slotW, disc, cardW, centerCardW, axisY, centerX: w / 2, row,
      // keep the focus front-and-center: ~2 columns per side (a 3rd only peeks in on wide screens)
      visN: Math.max(1, Math.min(2, Math.round((w / 2 - disc / 2 - cardW / 2) / slotW))),
      sideCap, centerCap
    };
    const s = stage.style;
    s.setProperty('--centerX', geo.centerX + 'px');
    s.setProperty('--axisY', axisY + 'px');
    s.setProperty('--slotW', slotW + 'px');
    s.setProperty('--cardW', cardW + 'px');
    s.setProperty('--centerCardW', centerCardW + 'px');
    s.setProperty('--disc', disc + 'px');
  }

  // ---------- rank space: columns are one-per-distinct-tempo, evenly spaced ----------
  // Positioning by *rank* (not raw BPM) keeps the dense catalogue from piling every
  // column onto the center; scrubbing slides them smoothly because rank is continuous.
  function rankOf (b) {
    const n = tempos.length;
    if (!n) return 0;
    if (b <= tempos[0]) return 0;
    if (b >= tempos[n - 1]) return n - 1;
    let i = 0; while (i < n - 1 && tempos[i + 1] <= b) i++;
    const span = tempos[i + 1] - tempos[i] || 1;
    return i + (b - tempos[i]) / span;
  }
  function bpmAtRank (r) {
    const n = tempos.length; if (!n) return bpm;
    r = Math.max(0, Math.min(n - 1, r));
    const i = Math.floor(r), f = r - i;
    if (i >= n - 1) return tempos[n - 1];
    return tempos[i] + f * (tempos[i + 1] - tempos[i]);
  }
  const clampBpm = v => tempos.length ? Math.max(tempos[0], Math.min(tempos[tempos.length - 1], v)) : v;

  // ---------- filter / index ----------
  function rebuildData () {
    const pool = activeGenres.size ? SONGS.filter(s => activeGenres.has(s.genre)) : SONGS;
    byTempo = new Map();
    for (const s of pool) {
      if (!byTempo.has(s.bpm)) byTempo.set(s.bpm, []);
      byTempo.get(s.bpm).push(s);
    }
    for (const arr of byTempo.values()) arr.sort((a, b) => b.popularity - a.popularity);
    tempos = [...byTempo.keys()].sort((a, b) => a - b);
    // filter changed -> song membership changed; rebuild every column fresh
    sideLayer.innerHTML = ''; sideCols.clear(); lastCenterKey = null;
    bpm = clampBpm(bpm);
  }

  // ---------- render ----------
  function render () {
    const disp = Math.round(bpm);
    if (!editingBpm) bigBpm.textContent = disp;   // don't clobber what the user is typing
    mark.textContent = markingFor(disp);
    stage.style.setProperty('--beat', (60 / Math.max(1, disp)).toFixed(3) + 's');

    const r = rankOf(bpm);
    renderCenter(disp);
    renderSides(r, disp);
  }

  function cardHTML (s) {
    return `<div class="card" data-bpm="${s.bpm}"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div>`;
  }

  function renderCenter (disp) {
    const songs = byTempo.get(disp) || [];
    const key = disp + '|' + songs.length;
    if (key === lastCenterKey) return;         // content only changes when the beat lands elsewhere
    lastCenterKey = key;

    if (!songs.length) {
      centerCol.innerHTML = `<div class="cards"><div class="empty">nothing lands exactly<br>on ${disp} BPM</div></div>`;
      return;
    }
    const cap = geo.centerCap;
    const shown = songs.slice(0, cap);
    const rest = songs.length - shown.length;
    let html = `<div class="cards"><div class="clabel">right on the beat · ${songs.length} song${songs.length > 1 ? 's' : ''}</div>`;
    shown.forEach((s, i) => {
      const bg = (0.15 - i * 0.02).toFixed(3), bd = (0.5 - i * 0.05).toFixed(3);
      html += `<div class="xcard" data-bpm="${s.bpm}" style="background:rgba(var(--accRGB),${bg});border:1.5px solid rgba(var(--accRGB),${bd})">
        <div class="badge">${s.bpm}<small>BPM</small></div>
        <div class="meta"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div>
      </div>`;
    });
    if (rest > 0) html += `<div class="xmore" data-bpm="${disp}">+${rest} more</div>`;
    html += '</div>';
    centerCol.innerHTML = html;
  }

  function renderSides (r, disp) {
    const seen = new Set();
    for (let i = 0; i < tempos.length; i++) {
      const t = tempos[i];
      if (t === disp) continue;               // the exact tempo is shown as the green center column
      const d = i - r;                        // rank offset from center
      if (Math.abs(d) > geo.visN + 1.3) continue;   // 2 full per side + a faint peek of the next
      seen.add(t);

      let col = sideCols.get(t);
      if (!col) col = buildSideColumn(t);
      const x = d * geo.slotW;
      const fade = Math.max(0.28, 1 - (Math.abs(d) - 0.5) * 0.34);
      col.style.transform = `translateX(${x.toFixed(1)}px)`;
      col.style.opacity = fade.toFixed(2);
    }
    // remove columns that scrolled out of the window (or became the center)
    for (const [t, col] of sideCols) {
      if (!seen.has(t)) { col.remove(); sideCols.delete(t); }
    }
  }

  function buildSideColumn (t) {
    const songs = byTempo.get(t) || [];
    const shown = songs.slice(0, geo.sideCap);
    const rest = songs.length - shown.length;
    const col = document.createElement('div');
    col.className = 'column';
    let html = `<div class="chip" data-bpm="${t}">${t} <span class="d">${t > bpm ? '+' : ''}${t - Math.round(bpm)}</span></div><div class="cards">`;
    html += shown.map(cardHTML).join('');
    if (rest > 0) html += `<div class="more">+${rest} more</div>`;
    html += '</div>';
    col.innerHTML = html;
    sideLayer.appendChild(col);
    sideCols.set(t, col);
    return col;
  }

  // keep the delta labels (−2, +3 …) honest as the center scrubs
  function refreshDeltas () {
    const disp = Math.round(bpm);
    for (const [t, col] of sideCols) {
      const d = col.querySelector('.chip .d');
      if (d) d.textContent = (t > disp ? '+' : '') + (t - disp);
    }
  }

  // ---------- set BPM ----------
  function setBpm (v, snap) {
    bpm = clampBpm(v);
    if (snap && tempos.length) bpm = tempos[Math.round(rankOf(bpm))];   // land on a real tempo
    render();
    refreshDeltas();
  }

  // ---------- genres ----------
  function buildGenres () {
    const counts = {};
    SONGS.forEach(s => counts[s.genre] = (counts[s.genre] || 0) + 1);
    const order = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const wrap = $('genres');
    wrap.innerHTML = `<button class="g-chip on" data-g="">All</button>` +
      order.map(g => `<button class="g-chip" data-g="${esc(g)}">${esc(g)}</button>`).join('');
    [...wrap.children].forEach(ch => ch.addEventListener('click', () => {
      const g = ch.dataset.g;
      if (g === '') activeGenres.clear();
      else activeGenres.has(g) ? activeGenres.delete(g) : activeGenres.add(g);
      [...wrap.children].forEach(c =>
        c.classList.toggle('on', c.dataset.g === '' ? activeGenres.size === 0 : activeGenres.has(c.dataset.g)));
      rebuildData();
      render();
    }));
  }

  // ---------- drag / scrub ----------
  let dragging = false, moved = false, lastX = 0, pid = null;
  field.addEventListener('pointerdown', e => {
    if (e.target.closest('.nbtn, .big, .g-chip')) return;
    dragging = true; moved = false; lastX = e.clientX; pid = e.pointerId;
    field.setPointerCapture(pid); field.classList.add('dragging');
  });
  field.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    if (Math.abs(dx) > 0) moved = true;
    const r = rankOf(bpm) - dx / geo.slotW;           // drag right → ruler right → slower
    bpm = clampBpm(bpmAtRank(r));
    render(); refreshDeltas();
  });
  function endDrag () {
    if (!dragging) return;
    dragging = false; field.classList.remove('dragging');
    if (pid != null) { try { field.releasePointerCapture(pid); } catch (_) {} pid = null; }
    if (moved) setBpm(bpm, true);                      // settle onto the nearest real tempo
  }
  field.addEventListener('pointerup', endDrag);
  field.addEventListener('pointercancel', endDrag);

  // click a card/chip → snap the beat to it (ignored if it was really a drag)
  field.addEventListener('click', e => {
    if (moved) return;
    const el = e.target.closest('[data-bpm]');
    if (el) setBpm(+el.dataset.bpm);
  });

  // trackpad / wheel horizontal scrub
  field.addEventListener('wheel', e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    e.preventDefault();
    bpm = clampBpm(bpmAtRank(rankOf(bpm) + d / geo.slotW));
    render(); refreshDeltas();
    clearTimeout(field._wheelT);
    field._wheelT = setTimeout(() => setBpm(bpm, true), 160);
  }, { passive: false });

  // ---------- nudge buttons + typeable center number ----------
  $('plus').addEventListener('click', () => setBpm(Math.round(bpm) + 1));
  $('minus').addEventListener('click', () => setBpm(Math.round(bpm) - 1));

  const selectBig = () => {
    const r = document.createRange(); r.selectNodeContents(bigBpm);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  bigBpm.addEventListener('focus', () => { editingBpm = true; requestAnimationFrame(selectBig); });
  bigBpm.addEventListener('input', () => {
    const digits = bigBpm.textContent.replace(/\D/g, '').slice(0, 3);
    if (digits !== bigBpm.textContent) {
      bigBpm.textContent = digits;
      const r = document.createRange(); r.selectNodeContents(bigBpm); r.collapse(false);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);   // keep caret at the end
    }
  });
  bigBpm.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); bigBpm.blur(); }
  });
  bigBpm.addEventListener('blur', () => {
    editingBpm = false;
    const v = parseInt(bigBpm.textContent, 10);
    if (!isNaN(v)) setBpm(v); else bigBpm.textContent = Math.round(bpm);
  });

  document.addEventListener('keydown', e => {
    if (editingBpm) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setBpm(Math.round(bpm) + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setBpm(Math.round(bpm) - 1); }
  });

  // ---------- (re)layout ----------
  function relayout () {
    computeGeo();
    sideLayer.innerHTML = ''; sideCols.clear(); lastCenterKey = null;
    render(); refreshDeltas();
  }
  let rT;
  window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(relayout, 120); });
  window.addEventListener('load', relayout);   // recompute once fonts/layout have settled

  // ---------- go ----------
  boot.then(() => {
    if (SHOW_GENRES) buildGenres();
    else $('genres').style.display = 'none';   // hide first so the field measures its true height
    computeGeo();
    rebuildData();
    setBpm(120, true);
    requestAnimationFrame(relayout);           // second pass after the browser has laid out
  });
})();
</script>
</body>
</html>
