<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tempo — feel the BPM through songs you know</title>
<style>
  :root {
    --bg: #0e1015; --panel: #171a22; --panel2: #1e222d; --line: #2a2f3c;
    --text: #e7ebf3; --dim: #8b93a7; --accent: #ff5a4d; --accent2: #ffd34e;
    --good: #4ad6a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #1a1f2b 0%, var(--bg) 60%);
    color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; justify-content: center;
    padding: 24px 16px 60px;
  }
  .app { width: 100%; max-width: 880px; }
  header { text-align: center; margin-bottom: 18px; }
  header h1 { font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  header p { color: var(--dim); font-size: 13px; margin-top: 3px; }

  .met {
    background: linear-gradient(180deg, var(--panel) 0%, #14171f 100%);
    border: 1px solid var(--line); border-radius: 20px; padding: 26px 24px 30px;
    box-shadow: 0 20px 60px -30px #000; text-align: center;
  }
  .pulse-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 14px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: #313747; transition: transform .05s, background .05s; }
  .dot.on { background: var(--accent); transform: scale(1.55); box-shadow: 0 0 18px var(--accent); }
  .dot.accent.on { background: var(--accent2); box-shadow: 0 0 18px var(--accent2); }

  .bpm { font-size: 84px; font-weight: 750; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .bpm small { font-size: 17px; font-weight: 600; color: var(--dim); letter-spacing: 0; margin-left: 6px; }
  .marking { color: var(--accent2); font-weight: 600; font-size: 14px; letter-spacing: .6px; text-transform: uppercase; margin-top: 4px; min-height: 18px; }

  .slider-wrap { margin: 22px 4px 6px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--p,30%), #2b3140 var(--p,30%)); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; border: 4px solid var(--accent); cursor: grab; box-shadow: 0 3px 10px #0008; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); cursor: grab; }
  .scale { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-top: 6px; }

  .controls { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 11px; padding: 11px 16px; cursor: pointer; transition: .12s; font-weight: 550; }
  button:hover { border-color: #3a4252; background: #232836; }
  button:active { transform: translateY(1px); }
  .nudge { width: 46px; font-size: 20px; font-weight: 600; }
  .play { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 120px; font-weight: 650; }
  .play.on { background: var(--good); border-color: var(--good); color: #06251b; }
  .tap { min-width: 92px; }
  select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }

  .genres { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 22px 0 4px; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--dim);
    cursor: pointer; font-size: 13px; transition: .12s; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .songs { margin-top: 16px; }
  .songs-head { display: flex; align-items: baseline; gap: 8px; color: var(--dim); font-size: 13px; margin: 0 4px 8px; }
  .songs-head b { color: var(--text); font-size: 15px; }
  ul { list-style: none; }
  li.song { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line);
    background: var(--panel); border-radius: 13px; margin-bottom: 8px; cursor: pointer; transition: .12s; }
  li.song:hover { border-color: var(--accent); background: var(--panel2); }
  li.song.here { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .sbpm { font-variant-numeric: tabular-nums; font-weight: 750; font-size: 20px; min-width: 58px; text-align: center; }
  .sbpm .d { font-size: 11px; color: var(--dim); font-weight: 500; }
  .smeta { flex: 1; min-width: 0; }
  .stitle { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sartist { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stag { color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; }
  .stag .g { display: inline-block; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; }
  .delta { font-size: 12px; font-weight: 600; }
  .delta.up { color: var(--accent2); } .delta.dn { color: #7fb2ff; } .delta.eq { color: var(--good); }
  .empty { color: var(--dim); text-align: center; padding: 30px; }
  footer { text-align: center; color: var(--dim); font-size: 12px; margin-top: 26px; line-height: 1.7; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Tempo</h1>
    <p>Slide the BPM and feel it through songs you already know.</p>
  </header>

  <div class="met">
    <div class="pulse-row" id="pulse"></div>
    <div class="bpm"><span id="bpmVal">120</span><small>BPM</small></div>
    <div class="marking" id="marking">Allegro</div>

    <div class="slider-wrap">
      <input type="range" id="slider" min="40" max="220" value="120" step="1" />
      <div class="scale"><span>40</span><span>90</span><span>120</span><span>160</span><span>220</span></div>
    </div>

    <div class="controls">
      <button class="nudge" id="minus" aria-label="slower">−</button>
      <button class="play" id="play">▶ Start</button>
      <button class="nudge" id="plus" aria-label="faster">+</button>
      <button class="tap" id="tap">Tap</button>
      <select id="sig" title="time signature">
        <option value="4">4 / 4</option>
        <option value="3">3 / 4</option>
        <option value="2">2 / 4</option>
        <option value="6">6 / 8</option>
      </select>
    </div>
  </div>

  <div class="genres" id="genres"></div>

  <div class="songs">
    <div class="songs-head"><b id="atLabel">Songs around 120 BPM</b><span id="countLabel"></span></div>
    <ul id="list"></ul>
  </div>

  <footer>
    BPM &amp; key data from
    <a href="https://www.deezer.com" target="_blank" rel="noopener">Deezer</a> and
    <a href="https://getsongbpm.com" target="_blank" rel="noopener">GetSongBPM</a>.
    <br />Click any song to set the metronome to its exact tempo.
  </footer>
</div>

<!-- generated dataset: window.SONGS = [...] -->
<script src="songs.js"></script>
<script>
(function () {
  // ---------- data load (songs.js, with fetch fallback) ----------
  let SONGS = window.SONGS || [];
  const boot = SONGS.length ? Promise.resolve(SONGS)
    : fetch('songs.json').then(r => r.json()).then(d => (SONGS = d)).catch(() => (SONGS = []));

  // ---------- tempo markings ----------
  const MARKINGS = [
    [0,'Grave'],[40,'Largo'],[60,'Larghetto'],[66,'Adagio'],[76,'Andante'],
    [108,'Moderato'],[120,'Allegro'],[156,'Vivace'],[168,'Presto'],[200,'Prestissimo']
  ];
  const markingFor = b => { let m='—'; for (const [t,n] of MARKINGS) if (b>=t) m=n; return m; };

  // ---------- state ----------
  let bpm = 120, playing = false, sig = 4;
  const genres = new Set();      // empty = all
  let audioCtx = null, nextNoteTime = 0, beat = 0, timer = null;
  let noteQueue = [], raf = null;

  const $ = id => document.getElementById(id);
  const slider = $('slider');

  // ---------- metronome audio (lookahead scheduler + rAF visual, "two clocks") ----------
  function ensureCtx () { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function click (time, accent) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = accent ? 1500 : 900;
    g.gain.setValueAtTime(accent ? 0.9 : 0.5, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    o.connect(g).connect(audioCtx.destination);
    o.start(time); o.stop(time + 0.06);
  }
  function scheduler () {
    while (nextNoteTime < audioCtx.currentTime + 0.1) {
      const beatInBar = beat % sig;
      const accent = beatInBar === 0;
      click(nextNoteTime, accent);
      noteQueue.push({ time: nextNoteTime, beatInBar, accent });
      nextNoteTime += 60 / bpm;
      beat++;
    }
    timer = setTimeout(scheduler, 25);
  }
  function draw () {
    const now = audioCtx ? audioCtx.currentTime : 0;
    let current = null;
    while (noteQueue.length && noteQueue[0].time <= now) current = noteQueue.shift();
    if (current) lightDot(current.beatInBar);
    raf = requestAnimationFrame(draw);
  }
  function lightDot (i) {
    const dots = $('pulse').children;
    [...dots].forEach(d => d.classList.remove('on'));
    if (dots[i]) dots[i].classList.add('on');
    setTimeout(() => { if (dots[i]) dots[i].classList.remove('on'); }, Math.min(110, 60000 / bpm * 0.5));
  }
  function start () {
    ensureCtx(); audioCtx.resume();
    playing = true; beat = 0; noteQueue = []; nextNoteTime = audioCtx.currentTime + 0.06;
    scheduler();
    raf = requestAnimationFrame(draw);
    $('play').classList.add('on'); $('play').textContent = '■ Stop';
  }
  function stop () {
    playing = false; clearTimeout(timer); cancelAnimationFrame(raf); noteQueue = [];
    $('play').classList.remove('on'); $('play').textContent = '▶ Start';
    [...$('pulse').children].forEach(d => d.classList.remove('on'));
  }
  function buildPulse () {
    const p = $('pulse'); p.innerHTML = '';
    for (let i = 0; i < sig; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' accent' : '');
      p.appendChild(d);
    }
  }

  // ---------- bpm setter ----------
  function setBpm (v, fromSlider) {
    bpm = Math.max(40, Math.min(220, Math.round(v)));
    $('bpmVal').textContent = bpm;
    $('marking').textContent = markingFor(bpm);
    if (!fromSlider) slider.value = bpm;
    const pct = ((bpm - 40) / (220 - 40)) * 100;
    slider.style.setProperty('--p', pct + '%');
    if (playing) { beat = 0; noteQueue = []; nextNoteTime = audioCtx.currentTime + 0.04; } // re-anchor
    renderSongs();
  }

  // ---------- song surfacing ----------
  function activeSongs () {
    return genres.size ? SONGS.filter(s => genres.has(s.genre)) : SONGS;
  }
  function renderSongs () {
    const pool = activeSongs();
    // widen the window until we have a useful handful
    let win = 2, near = [];
    while (win <= 16) {
      near = pool.filter(s => Math.abs(s.bpm - bpm) <= win);
      if (near.length >= 6) break;
      win += 2;
    }
    near.sort((a, b) =>
      Math.abs(a.bpm - bpm) - Math.abs(b.bpm - bpm) || b.popularity - a.popularity
    );
    const top = near.slice(0, 9);

    $('atLabel').textContent = `Songs around ${bpm} BPM`;
    $('countLabel').textContent = top.length ? `±${win} BPM` : '';
    const list = $('list');
    if (!top.length) { list.innerHTML = '<div class="empty">No songs nearby in this genre. Try a wider genre or another tempo.</div>'; return; }

    list.innerHTML = top.map(s => {
      const d = s.bpm - bpm;
      const here = Math.abs(d) <= 1;
      const deltaCls = here ? 'eq' : d > 0 ? 'up' : 'dn';
      const deltaTxt = here ? 'right here' : (d > 0 ? `+${d} faster` : `${d} slower`);
      return `<li class="song${here ? ' here' : ''}" data-bpm="${s.bpm}">
        <div class="sbpm">${s.bpm}<div class="d">BPM</div></div>
        <div class="smeta">
          <div class="stitle">${esc(s.title)}</div>
          <div class="sartist">${esc(s.artist)}${s.year ? ' · ' + s.year : ''}</div>
        </div>
        <div class="stag">
          <div class="delta ${deltaCls}">${deltaTxt}</div>
          <span class="g">${esc(s.genre)}</span>
        </div>
      </li>`;
    }).join('');

    [...list.querySelectorAll('.song')].forEach(li =>
      li.addEventListener('click', () => setBpm(+li.dataset.bpm)));
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- genres ----------
  function buildGenres () {
    const counts = {};
    SONGS.forEach(s => counts[s.genre] = (counts[s.genre] || 0) + 1);
    const order = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const wrap = $('genres');
    wrap.innerHTML = `<button class="chip on" data-g="">All</button>` +
      order.map(g => `<button class="chip" data-g="${g}">${esc(g)}</button>`).join('');
    [...wrap.children].forEach(ch => ch.addEventListener('click', () => {
      const g = ch.dataset.g;
      if (g === '') { genres.clear(); }
      else { genres.has(g) ? genres.delete(g) : genres.add(g); }
      // sync chip states
      [...wrap.children].forEach(c => {
        if (c.dataset.g === '') c.classList.toggle('on', genres.size === 0);
        else c.classList.toggle('on', genres.has(c.dataset.g));
      });
      renderSongs();
    }));
  }

  // ---------- tap tempo ----------
  let taps = [];
  function tap () {
    const now = performance.now();
    taps = taps.filter(t => now - t < 2500);
    taps.push(now);
    if (taps.length >= 2) {
      const intervals = [];
      for (let i = 1; i < taps.length; i++) intervals.push(taps[i] - taps[i - 1]);
      const avg = intervals.reduce((a, b) => a + b) / intervals.length;
      setBpm(60000 / avg);
    }
  }

  // ---------- wire up ----------
  slider.addEventListener('input', e => setBpm(+e.target.value, true));
  $('plus').addEventListener('click', () => setBpm(bpm + 1));
  $('minus').addEventListener('click', () => setBpm(bpm - 1));
  $('play').addEventListener('click', () => playing ? stop() : start());
  $('tap').addEventListener('click', tap);
  $('sig').addEventListener('change', e => { sig = +e.target.value; buildPulse(); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); playing ? stop() : start(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') setBpm(bpm + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') setBpm(bpm - 1);
    else if (e.key.toLowerCase() === 't') tap();
  });

  buildPulse();
  boot.then(() => { buildGenres(); setBpm(120); });
})();
</script>
</body>
</html>
